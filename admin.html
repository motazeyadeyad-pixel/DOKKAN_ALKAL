<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم دكان الخال</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 15px; direction: rtl; }
    .admin-card { background: white; max-width: 600px; margin: 0 auto 18px auto; padding: 20px; border-radius: 14px; box-shadow: 0 3px 15px rgba(0,0,0,0.08); }
    h2 { color: #006b3c; margin-top: 0; text-align: center; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    .btn-add { background: linear-gradient(135deg,#00b06b,#006b3c); color: white; border: none; padding: 13px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; }
    .btn-upload { background: #0284c7; color: white; border: none; padding: 11px; width: 100%; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-bottom: 6px; }
    .preview-img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; }
    .search-box { max-width: 600px; margin: 0 auto 12px; }
    .search-box input { padding: 12px; border-radius: 10px; }
    .product-item { background: white; padding: 12px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #eee; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .product-item img { width: 55px; height: 55px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
    .product-main { flex: 1; min-width: 150px; }
    .category-badge { background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
    .status-badge { font-size: 12px; font-weight: bold; }
    .status-on { color: #16a34a; }
    .status-off { color: #dc2626; }
    .actions { display: flex; gap: 5px; flex-wrap: wrap; width: 100%; margin-top: 8px; }
    .actions input, .actions select { width: auto; padding: 6px 8px; font-size: 13px; }
    .actions button { padding: 7px 12px; border: none; border-radius: 7px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .btn-toggle { background: #f59e0b; color: white; }
    .btn-delete { background: #ef4444; color: white; }
    .btn-save { background: #10b981; color: white; }
    .btn-fix { background: #7c3aed; color: white; }
    .heavy-badge { font-size: 11px; color: #b45309; font-weight: bold; }
    #orders-list { max-width: 600px; margin: 0 auto; }
    .empty { text-align: center; color: #888; padding: 30px; }
</style>
</head>
<body>

<div class="admin-card">
    <h2>➕ إضافة منتج جديد</h2>
    <input type="hidden" id="p-image-url">

    <div class="form-group">
        <label>اسم المنتج</label>
        <input type="text" id="p-name" placeholder="مثال: حلاوة سكاكر">
    </div>

    <div class="form-group">
        <label>السعر (بالدينار)</label>
        <input type="number" step="0.05" id="p-price" placeholder="مثال: 0.25">
    </div>

    <div class="form-group">
        <label>القسم</label>
        <select id="p-category">
            <option value="مواد غذائية">🥫 مواد غذائية</option>
            <option value="سكاكر">🍬 سكاكر وحلويات</option>
            <option value="مشروبات">🥤 مشروبات</option>
            <option value="منظفات">🧴 منظفات</option>
            <option value="مستلزمات شخصية">🧼 مستلزمات شخصية</option>
        </select>
    </div>

    <div class="form-group">
        <label>صورة المنتج</label>
        <button type="button" class="btn-upload" onclick="uploadImage()">📷 رفع / التقاط صورة</button>
        <img id="image-preview" class="preview-img" alt="معاينة">
    </div>

    <button class="btn-add" onclick="addProduct()">حفظ المنتج</button>
</div>

<div class="admin-card">
    <h2>📦 المنتجات الحالية</h2>
    <div class="search-box">
        <input type="text" id="admin-search" placeholder="🔍 دور على منتج..." oninput="renderProductsList()">
    </div>
    <div id="admin-products-list">جاري التحميل...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCijhMKaJTyfL8p76-31GbfzCpLF2bui1A",
        authDomain: "motaz-f6c67.firebaseapp.com",
        databaseURL: "https://motaz-f6c67-default-rtdb.firebaseio.com",
        projectId: "motaz-f6c67",
        storageBucket: "motaz-f6c67.firebasestorage.app",
        messagingSenderId: "553305284670",
        appId: "1:553305284670:web:4fdf78e304fd7aaa34b16f"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // نفس إعدادات Cloudinary تبع الموقع الرئيسي — الصورة بترفع كرابط خفيف
    // بدل ما تترفع كنص ضخم جوا قاعدة البيانات (هاد كان سبب تعليق الموقع)
    const CLOUDINARY_CLOUD_NAME = "gfyyessl";
    const CLOUDINARY_UPLOAD_PRESET = "dokan_preset";

    let allProducts = [];

    function uploadImage() {
        if (typeof cloudinary === "undefined") {
            alert("مكتبة رفع الصور ما تحملت، تأكد من الإنترنت وحاول تاني.");
            return;
        }
        cloudinary.createUploadWidget({
            cloudName: CLOUDINARY_CLOUD_NAME,
            uploadPreset: CLOUDINARY_UPLOAD_PRESET,
            sources: ['local', 'camera'],
            multiple: false,
            language: 'ar'
        }, (error, result) => {
            if (!error && result && result.event === "success") {
                document.getElementById("p-image-url").value = result.info.secure_url;
                const preview = document.getElementById("image-preview");
                preview.src = result.info.secure_url;
                preview.style.display = "block";
            }
        }).open();
    }

    function addProduct() {
        const name = document.getElementById("p-name").value.trim();
        const price = parseFloat(document.getElementById("p-price").value);
        const category = document.getElementById("p-category").value;
        const image = document.getElementById("p-image-url").value;

        if (!name || isNaN(price)) {
            alert("أدخل اسم وسعر صحيحين.");
            return;
        }

        db.ref("products").push({
            name, price, category,
            image: image || "",
            available: true
        }).then(() => {
            alert("تمت الإضافة ✅");
            resetForm();
        }).catch(err => alert("خطأ: " + err.message));
    }

    function resetForm() {
        document.getElementById("p-name").value = "";
        document.getElementById("p-price").value = "";
        document.getElementById("p-image-url").value = "";
        document.getElementById("image-preview").style.display = "none";
    }

    // تحميل مباشر ولحظي لكل المنتجات (خفيف جداً الآن لأن الصور روابط لا نصوص ضخمة)
    db.ref("products").on("value", (snap) => {
        const data = snap.val() || {};
        allProducts = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        renderProductsList();
    });

    function renderProductsList() {
        const list = document.getElementById("admin-products-list");
        const query = (document.getElementById("admin-search").value || "").trim().toLowerCase();

        let items = allProducts;
        if (query) items = items.filter(p => (p.name || "").toLowerCase().includes(query));

        if (items.length === 0) {
            list.innerHTML = "<p class='empty'>لا توجد منتجات.</p>";
            return;
        }

        list.innerHTML = items.map(p => {
            const isHeavy = typeof p.image === "string" && p.image.startsWith("data:");
            const imgSrc = isHeavy ? p.image : (p.image || "https://via.placeholder.com/55?text=%20");
            const isAvailable = p.available !== false;
            return `
                <div class="product-item">
                    <img src="${imgSrc}" onerror="this.src='https://via.placeholder.com/55?text=%20'">
                    <div class="product-main">
                        <strong>${escapeHTML(p.name)}</strong>
                        <span class="category-badge">${escapeHTML(p.category || 'عام')}</span><br>
                        <span class="status-badge ${isAvailable ? 'status-on' : 'status-off'}">${isAvailable ? '✅ متوفر' : '⛔ غير متوفر'}</span>
                        ${isHeavy ? `<br><span class="heavy-badge">⚠️ صورة ثقيلة — بتبطّئ الموقع</span>` : ""}
                    </div>
                    <div class="actions">
                        <input type="number" step="0.05" id="price-${p.id}" value="${p.price}" style="width:75px;">
                        <button class="btn-save" onclick="savePrice('${p.id}')">حفظ السعر</button>
                        <button class="btn-toggle" onclick="toggleAvailable('${p.id}', ${isAvailable})">${isAvailable ? 'إيقاف' : 'تفعيل'}</button>
                        <button class="btn-delete" onclick="deleteProduct('${p.id}')">حذف</button>
                        ${isHeavy ? `<button class="btn-fix" onclick="fixImage('${p.id}')">📷 صلّح الصورة</button>` : ""}
                    </div>
                </div>`;
        }).join("");
    }

    function fixImage(id) {
        if (typeof cloudinary === "undefined") {
            alert("مكتبة رفع الصور ما تحملت.");
            return;
        }
        cloudinary.createUploadWidget({
            cloudName: CLOUDINARY_CLOUD_NAME,
            uploadPreset: CLOUDINARY_UPLOAD_PRESET,
            sources: ['local', 'camera'],
            multiple: false,
            language: 'ar'
        }, (error, result) => {
            if (!error && result && result.event === "success") {
                db.ref(`products/${id}/image`).set(result.info.secure_url).then(() => {
                    alert("تم تصليح الصورة ✅");
                });
            }
        }).open();
    }

    function savePrice(id) {
        const newPrice = parseFloat(document.getElementById(`price-${id}`).value);
        if (isNaN(newPrice)) { alert("سعر غير صحيح."); return; }
        db.ref(`products/${id}/price`).set(newPrice);
    }

    function toggleAvailable(id, current) {
        db.ref(`products/${id}/available`).set(!current);
    }

    function deleteProduct(id) {
        if (confirm("متأكد من الحذف نهائياً؟")) {
            db.ref(`products/${id}`).remove();
        }
    }

    function escapeHTML(str) {
        return String(str ?? "").replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));
    }
</script>
</body>
</html>
