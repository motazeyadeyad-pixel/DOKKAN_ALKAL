<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الطلبات - دكان الخال</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
    body { background:#f5f7f6; padding:15px; }
    h1 { color:#006b3c; text-align:center; margin-bottom:20px; font-size:22px; }
    #login-box { max-width:320px; margin:80px auto; background:#fff; padding:25px; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,0.1); text-align:center; }
    #login-box input { width:100%; padding:12px; border:1px solid #ddd; border-radius:10px; margin:12px 0; font-size:15px; }
    #login-box button { width:100%; padding:12px; background:#006b3c; color:#fff; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
    .order-card { background:#fff; border-radius:14px; padding:15px; margin-bottom:14px; box-shadow:0 3px 12px rgba(0,0,0,0.06); }
    .order-card .top { display:flex; justify-content:space-between; font-weight:bold; margin-bottom:6px; }
    .order-card .items { font-size:14px; color:#555; margin-bottom:6px; }
    .order-card .meta { font-size:13px; color:#777; margin-bottom:10px; }
    .status-buttons { display:flex; flex-wrap:wrap; gap:6px; }
    .status-buttons button { flex:1; min-width:70px; padding:8px 4px; font-size:12px; border-radius:8px; border:1px solid #ccc; background:#f0f0f0; cursor:pointer; }
    .status-buttons button.active { background:#006b3c; color:#fff; border-color:#006b3c; font-weight:bold; }
    #orders-list { max-width:600px; margin:0 auto; }
    .empty { text-align:center; color:#888; padding:40px; }
    .store-panel { max-width:600px; margin:0 auto 18px; background:#fff; border-radius:14px; padding:15px; box-shadow:0 3px 12px rgba(0,0,0,0.06); }
    .store-panel .store-title { font-weight:bold; margin-bottom:6px; }
    #store-state { font-size:14px; margin-bottom:10px; padding:8px 10px; border-radius:8px; background:#e8f5ee; color:#006b3c; }
    #store-state.closed { background:#fdecec; color:#b42318; }
    .store-btns { display:flex; gap:8px; }
    .store-btns button { flex:1; padding:12px 6px; font-size:14px; border-radius:10px; border:2px solid #ccc; background:#f0f0f0; cursor:pointer; font-weight:bold; }
    .store-btns button.active { background:#b42318; color:#fff; border-color:#b42318; }
    .store-hint { font-size:12px; color:#888; margin-top:8px; }
    .photo-strip { display:flex; gap:8px; overflow-x:auto; padding:4px 0 8px; margin-bottom:6px; -webkit-overflow-scrolling:touch; }
    .photo-item { flex:0 0 auto; width:62px; text-align:center; position:relative; }
    .photo-item img { width:56px; height:56px; object-fit:cover; border-radius:8px; background:#eee; border:1px solid #e3e3e3; display:block; margin:0 auto; }
    .photo-item .qty { position:absolute; top:-4px; right:0; background:#006b3c; color:#fff; font-size:11px; font-weight:bold; border-radius:10px; padding:1px 6px; }
    .photo-item .pname { font-size:10px; color:#555; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>

<div id="login-box">
    <h1>دخول الإدارة</h1>
    <input type="password" id="admin-pass" placeholder="كلمة السر">
    <button onclick="checkPassword()">دخول</button>
</div>

<div id="admin-panel" style="display:none;">
    <h1>📦 إدارة الطلبات</h1>
    <div class="store-panel">
        <div class="store-title">🏪 حالة المتجر</div>
        <div id="store-state">🟢 المتجر مفتوح</div>
        <div class="store-btns">
            <button id="btn-sleep" onclick="setStoreClosed('sleep')">🌙 مغلق للنوم</button>
            <button id="btn-break" onclick="setStoreClosed('break')">⏳ مغلق لفترة (أكل / صلاة)</button>
        </div>
        <div class="store-hint">اضغط الزر مرة ثانية لإعادة فتح المتجر. الزبون يقدر يتصفح بس ما يقدر يطلب وهو مغلق.</div>
    </div>
    <div id="orders-list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    // ⚠️ غيّر كلمة السر هاي لأي شي تحبه أنت بس
    const ADMIN_PASSWORD = "motaz123";

    const firebaseConfig = {
        apiKey: "AIzaSyCijhMKaJTyfL8p76-31GbfzCpLF2bui1A",
        authDomain: "motaz-f6c67.firebaseapp.com",
        databaseURL: "https://motaz-f6c67-default-rtdb.firebaseio.com",
        projectId: "motaz-f6c67",
        storageBucket: "motaz-f6c67.firebasestorage.app",
        messagingSenderId: "553305284670",
        appId: "1:553305284670:web:4fdf78e304fd7aaa34b16f"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const ORDER_STATUSES = ["تم استلام الطلب", "جاري التجهيز", "خرج للتوصيل", "تم التسليم"];

    // ===== التحكم بحالة المتجر =====
    let currentStore = { closed: false };
    function watchStoreStatus() {
        db.ref("storeStatus").on("value", (snap) => {
            currentStore = snap.val() || { closed: false };
            const stateEl = document.getElementById("store-state");
            const closed = !!currentStore.closed;
            stateEl.classList.toggle("closed", closed);
            stateEl.textContent = !closed ? "🟢 المتجر مفتوح"
                : currentStore.reason === "sleep" ? "🔴 المتجر مغلق (للنوم)" : "🔴 المتجر مغلق (لفترة محدودة)";
            document.getElementById("btn-sleep").classList.toggle("active", closed && currentStore.reason === "sleep");
            document.getElementById("btn-break").classList.toggle("active", closed && currentStore.reason === "break");
        });
    }
    function setStoreClosed(reason) {
        const sameActive = currentStore.closed && currentStore.reason === reason;
        const data = sameActive ? { closed: false, updatedAt: Date.now() }
                                : { closed: true, reason: reason, updatedAt: Date.now() };
        db.ref("storeStatus").set(data).catch(() => alert("تعذر تغيير حالة المتجر، تأكد من الإنترنت وصلاحيات Firebase."));
    }

    function checkPassword() {
        const val = document.getElementById("admin-pass").value;
        if (val === ADMIN_PASSWORD) {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("admin-panel").style.display = "block";
            loadOrders();
            watchStoreStatus();
        } else {
            alert("كلمة السر غلط");
        }
    }

    function loadOrders() {
        db.ref("orders").limitToLast(50).on("value", (snap) => {
            const listEl = document.getElementById("orders-list");
            const data = snap.val();
            if (!data) {
                listEl.innerHTML = "<p class='empty'>لا يوجد طلبات بعد.</p>";
                return;
            }
            const orders = Object.keys(data).map(id => ({ id, ...data[id] }));
            orders.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            listEl.innerHTML = orders.map(order => {
                const itemsText = (order.items || []).map(i => `${i.name} x${i.quantity}`).join("، ");
                const date = order.createdAt ? new Date(order.createdAt).toLocaleString("ar-EG") : "";
                const buttons = ORDER_STATUSES.map(status =>
                    `<button class="${order.status === status ? 'active' : ''}" onclick="updateStatus('${order.id}','${status}')">${status}</button>`
                ).join("");

                return `
                    <div class="order-card">
                        <div class="top"><span>👤 ${escapeHTML(order.customerName || "")}</span><span>${(order.total || 0).toFixed(2)} د</span></div>
                        ${photoStrip(order.items)}
                        <div class="items">${escapeHTML(itemsText)}</div>
                        <div class="meta">📞 ${escapeHTML(order.phone || "")} — ${date}</div>
                        <div class="status-buttons">${buttons}</div>
                    </div>`;
            }).join("");
        });
    }

    function thumbUrl(url) {
        url = String(url || "").trim();
        if (!/^https?:\/\//.test(url)) return "";
        if (url.includes("res.cloudinary.com") && url.includes("/upload/") && !url.includes("/upload/w_")) {
            return url.replace("/upload/", "/upload/w_120,h_120,c_fill,q_auto,f_auto/");
        }
        return url;
    }

    function photoStrip(items) {
        const withImg = (items || []).filter(i => thumbUrl(i.image));
        if (!withImg.length) return "";
        return '<div class="photo-strip">' + withImg.map(i =>
            `<div class="photo-item" title="${escapeHTML(i.name)}">
                <span class="qty">×${escapeHTML(i.quantity)}</span>
                <img src="${escapeHTML(thumbUrl(i.image))}" alt="" loading="lazy">
                <div class="pname">${escapeHTML(i.name)}</div>
            </div>`).join("") + "</div>";
    }

    function updateStatus(orderId, status) {
        db.ref(`orders/${orderId}/status`).set(status);
    }

    function escapeHTML(str) {
        return String(str ?? "").replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));
    }
</script>
</body>
</html>
